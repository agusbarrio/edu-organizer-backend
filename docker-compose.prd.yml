services:
  backend:
    container_name: edu-organizer-backend-prd
    image: ghcr.io/agusbarrio/edu-organizer-backend:latest
    pull_policy: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - edu_organizer_prd_uploads_new:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rustfs-net

networks:
  rustfs-net:
    external: true

volumes:
  edu_organizer_prd_uploads_new:
    external: true
